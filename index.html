<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration Form</title>

    <style>
        body {
            background: skyblue;
            font-family: Arial, Helvetica, sans-serif;
        }

        h2 {
            text-align: center;
        }

        .container {
            width: 350px;
            margin: 50px auto;
            padding: 20px;
            background: white;
            border-radius: 5px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }

        input {
            width: 100%;
            margin: 10px 0;
            padding: 12px;
            box-sizing: border-box;
            font-size: 15px;
        }

        button {
            width: 100%;
            color: white;
            background: green;
            border: none;
            padding: 15px;
            border-radius: 4px;
            font-size: 20px;
            cursor: pointer;
        }

        button:hover {
            color: yellow;
            background: blue;
        }

        #message {
            text-align: center;
            margin-top: 10px;
            font-weight: bold;
            color: green;
        }
    </style>
</head>

<body>

    <div class="container">
        <h2>Register Here</h2>
        <hr>

        <form id="registerForm">

            <input
                type="text"
                id="firstName"
                placeholder="First Name"
                required>

            <input
                type="text"
                id="lastName"
                placeholder="Last Name"
                required>

            <input
                type="email"
                id="email"
                placeholder="Enter Your Email"
                required>

            <input
                type="tel"
                id="mobile"
                placeholder="Enter Your Mobile Number"
                required>

            <button type="submit">
                Register
            </button>

        </form>

        <p id="message"></p>

    </div>

    <script>

const SCRIPT_URL =
"https://script.google.com/macros/s/AKfycbwVYOL7cOJruUg_DjvMBZD7sBLRTtnhjmN2aTNQWGoU_QbIa-Zo8jEkVpTfxbwC7mBR/exec";

document.getElementById("registerForm")
.addEventListener("submit", async function(event) {

    event.preventDefault();

    const firstName =
        document.getElementById("firstName").value;

    const lastName =
        document.getElementById("lastName").value;

    const email =
        document.getElementById("email").value;

    const mobile =
        document.getElementById("mobile").value;

    const data = {
        firstName: firstName,
        lastName: lastName,
        email: email,
        mobile: mobile
    };

    try {

        await fetch(SCRIPT_URL, {
            method: "POST",
            body: JSON.stringify(data)
        });

        document.getElementById("message").innerHTML =
            "✅ Registration Successful!";

        this.reset();

    } catch (error) {

        document.getElementById("message").innerHTML =
            "❌ Error saving data.";

        console.error(error);
    }

});

</script>

</body>
</html>
